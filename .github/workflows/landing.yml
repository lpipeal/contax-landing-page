name: Contax Landing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, refactor]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:export
      - name: Verify static entry points
        run: |
          test -s out/index.html
          test -s out/en.html
          test -s out/404.html
          test -s out/contax/contax-logo-consolidado-transparente.webp
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
      - name: Save Hosting artifact
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-hosting
          path: out/
          if-no-files-found: error

  deploy:
    name: Publish release to Firebase Hosting
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: firebase-contax-landing-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-hosting
          path: out
      - name: Check deployment identity configuration
        env:
          FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          FIREBASE_DEPLOYER: ${{ vars.FIREBASE_DEPLOYER }}
        run: |
          if [[ -z "$FIREBASE_WIF_PROVIDER" || -z "$FIREBASE_DEPLOYER" ]]; then
            echo "::error::Configure FIREBASE_WIF_PROVIDER and FIREBASE_DEPLOYER in the production environment."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOYER }}
      - name: Deploy the landing
        run: npx --yes firebase-tools@15.27.0 deploy --only hosting:landing --project contax-business-solutions --non-interactive --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Verify published routes
        run: |
          curl -fsSL --retry 3 https://contax-business-solutions.web.app/ -o /dev/null
          curl -fsSL --retry 3 https://contax-business-solutions.web.app/en -o /dev/null
